# Runs Renovate, as the GitHub App, for every repo the App is installed on,
# once per account it is installed on (an installation token covers one
# account). Each repo's schedule decides what happens in a run:
# - default.json (infra): new branches and automerges only on Friday
#   01:00-07:59 Berlin time. The Friday runs cover that window in winter
#   (UTC+1) and summer (UTC+2): Thursday 23:00 UTC is 01:00 in summer and
#   does nothing in winter, and the last run starts by 06:00 UTC.
# - fast.json (software): at any time, so the twice-daily runs pick up
#   updates and merge them once CI has passed, usually the same day.
name: renovate

on:
  schedule:
    - cron: "0 23 * * 4"
    - cron: "0 0-6 * * 5"
    - cron: "0 4,16 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    strategy:
      # One account's failure (e.g. a missing installation) doesn't stop the other
      fail-fast: false
      matrix:
        owner: [pgschk, ElectricDynamite]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A short-lived installation token for every repo the App is installed
      # on in this account
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: config.js
          # Renovate updates this input itself; keep it a plain version, the
          # same as RENOVATEBOT_VERSION in validate.yml
          renovate-version: 44.239.1
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Private images on ghcr.io: a classic PAT with read:packages only.
          # GitHub App tokens can't read GHCR.
          RENOVATE_HOST_RULES: ${{ format('[{{"matchHost":"ghcr.io","hostType":"docker","username":"pgschk","password":"{0}"}}]', secrets.RENOVATE_GHCR_TOKEN) }}
